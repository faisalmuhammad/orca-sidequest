<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Sidequest</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="visuals.css">
  </head>
  <body>
    <main id="app" aria-label="Sidequest" aria-busy="true">
      <div class="loading">Opening Sidequest…</div>
    </main>
    <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
      <form method="dialog">
        <span class="eyebrow">NEW START</span>
        <h2 id="confirm-title">Start a new game?</h2>
        <p id="confirm-description">Your current board will be replaced.</p>
        <div class="dialog-actions">
          <button value="cancel" class="button" autofocus>Keep playing</button>
          <button value="confirm" class="button primary">Start new</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
